services:
  - type: web
    name: whitehat-dojo-live
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run seed -w server && npm run start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: dojo-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CLIENT_ORIGIN
        value: https://whitehat-dojo-live.onrender.com
      - key: DATABASE_PATH
        value: /var/data/whitehat-dojo.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@whitehatdojo.local
      - key: NODE_VERSION
        value: 22.16.0
