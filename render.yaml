services:
  - type: web
    name: whitehat-dojo-live
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run seed -w server && npm run start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: CLIENT_ORIGIN
        value: https://whitehat-dojo-live.onrender.com
      - key: DATABASE_PATH
        value: /tmp/whitehat-dojo.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: ChangeMe123!
      - key: ADMIN_EMAIL
        value: admin@whitehatdojo.local
      - key: GOOGLE_CLIENT_ID
        value: 58916445909-kv3vsqjnp4el5r8h4elr21qga7delp3v.apps.googleusercontent.com
      - key: VITE_GOOGLE_CLIENT_ID
        value: 58916445909-kv3vsqjnp4el5r8h4elr21qga7delp3v.apps.googleusercontent.com
      - key: NODE_VERSION
        value: 22.16.0
